name: 4. Build Trio
run-name: Smart Meal Trio TestFlight (${{ github.ref_name }})
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified build to the existing TestFlight app
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: smart-meal-trio-testflight
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feature/smart-meal-receiver'
    name: Build and verify Smart Meal receiver
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Confirm requested source
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD > smart-meal-source.txt
      - name: Select existing Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Install pinned project dependencies
        run: bundle install
      # Existing signing assets only. No upstream sync, certificate creation or revocation.
      - name: Build signed App Store archive
        run: |
          test "$TEAMID" = "D3GG62L9X8"
          bundle exec fastlane build_trio
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
      - name: Verify source, identity and distribution signing
        run: python3 scripts/verify-smart-meal-distribution.py Trio.ipa --source "$(cat smart-meal-source.txt)" --output smart-meal-verification.json
      - name: Upload verified build to existing TestFlight app
        if: inputs.publish
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      # Do not attach raw build logs, signing keys, credentials or provisioning profiles.
      - name: Save signed build and verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smart-meal-trio-distribution
          path: |
            Trio.ipa
            artifacts/*.dSYM.zip
            smart-meal-source.txt
            smart-meal-verification.json
          retention-days: 14
