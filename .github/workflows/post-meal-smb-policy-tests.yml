name: Post-meal SMB isolated policy tests

# Tests simulation-only policy code. Does not build, install or actuate Trio/pump.
on:
  push:
    branches:
      - feature/post-meal-smb-lockout-prototype
    paths:
      - 'Engineering/PostMealSMBLockout/**'
      - '.github/workflows/post-meal-smb-policy-tests.yml'
  pull_request:
    paths:
      - 'Engineering/PostMealSMBLockout/**'
      - '.github/workflows/post-meal-smb-policy-tests.yml'

permissions:
  contents: read

jobs:
  policy-unit-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Swift package tests
        run: swift test --package-path Engineering/PostMealSMBLockout
