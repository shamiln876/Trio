name: Nearby Bluetooth signed preview candidates
on:
  push:
    branches: [feature/nearby-bluetooth-readonly]
    paths: [.github/workflows/nearby-candidates.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: nearby-preview-candidates
  cancel-in-progress: false
env:
  CI: 'true'
jobs:
  candidates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Trio
            sha: ea2f0a6fa9174160215fdcd89972c61dd87e7c3a
            run: 39557843516
            runner: macos-26
            xcode: Xcode_26.2.app
            lane: build_trio
            verifier: scripts/verify-smart-meal-distribution.py
          - app: LoopFollow
            sha: e6fb381ba0a9e4f0774623df2f846a2a3d5e0216
            run: 39557820147
            runner: xcode-27
            xcode: Xcode_27.app
            lane: build_LoopFollow
            verifier: Scripts/verify-smart-meal-distribution.py
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - name: Require passing exact-source protocol and simulator build
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          SOURCE: ${{ matrix.sha }}
          RUN: ${{ matrix.run }}
        run: |
          for attempt in $(seq 1 90); do
            gh api "repos/shamiln876/$APP/actions/runs/$RUN" > "$RUNNER_TEMP/nearby-gate.json"
            state=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/nearby-gate.json"))["status"])')
            if [ "$state" = completed ]; then break; fi
            sleep 20
          done
          python3 - <<'GATE'
          import json, os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/nearby-gate.json'))
          assert r['head_sha'] == os.environ['SOURCE']
          assert r['path'] == '.github/workflows/nearby-bluetooth.yml'
          assert r['status'] == 'completed' and r['conclusion'] == 'success'
          GATE
      - uses: actions/checkout@v5
        with:
          repository: shamiln876/${{ matrix.app }}
          ref: ${{ matrix.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode and install existing build tools
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          bundle install
          table_path=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          test -f "$table_path"
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$table_path"
      - name: Build with existing family identity and read-only signing assets
        run: bundle exec fastlane "${{ matrix.lane }}"
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: 'true'
          USE_EXISTING_TRIO_CERTIFICATE: 'true'
          NATIVE_PLATE_SCANNER_REQUIRED: 'true'
          MINIMUM_BUILD_NUMBER: '30'
      - name: Verify signed app identity and exact source
        env:
          APP: ${{ matrix.app }}
          SOURCE: ${{ matrix.sha }}
          VERIFIER: ${{ matrix.verifier }}
        run: |
          python3 "$VERIFIER" "$APP.ipa" --source "$SOURCE" --output nearby-candidate.json
          shasum -a 256 "$APP.ipa" > "$APP.ipa.sha256"
          if [ "$APP" = LoopFollow ]; then python3 Scripts/verify-native-plate-ipa.py LoopFollow.ipa; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-${{ matrix.app }}-candidate
          path: |
            ${{ matrix.app }}.ipa
            ${{ matrix.app }}.ipa.sha256
            nearby-candidate.json
