name: Native LoopFollow scanner release
run-name: LoopFollow Live Activity foreground repair · existing family signing
on:
  workflow_dispatch:
  push:
    branches: [feature/native-plate-distribution]
    paths: [.github/workflows/build_native_plate.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-plate-testflight
  cancel-in-progress: false
jobs:
  build:
    defaults:
      run:
        working-directory: loopfollow
    name: Build and upload reviewed native scanner
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      LOOPFOLLOW_SOURCE_COMMIT: d28b60e7c90f8424da838be4e820d9b433081ee5
      LOOPFOLLOW_WORKSPACE: ${{ github.workspace }}/loopfollow
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # The existing lane imports the valid family certificate read-only. It can
      # provision profiles for LoopFollow, but cannot revoke/create certificates.
      USE_EXISTING_TRIO_CERTIFICATE: 'true'
      MATCH_READONLY: 'true'
      NATIVE_PLATE_SCANNER_REQUIRED: 'true'
      MINIMUM_BUILD_NUMBER: '29'
      WAIT_FOR_PROCESSING: 'true'
    steps:
      - name: Check out status helper only; do not build Trio
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out the pinned reviewed LoopFollow source
        uses: actions/checkout@v5
        with:
          repository: shamiln876/LoopFollow
          ref: d28b60e7c90f8424da838be4e820d9b433081ee5
          path: loopfollow
          persist-credentials: false
      - name: Verify the pinned LoopFollow source
        run: test "$(git rev-parse HEAD)" = "$LOOPFOLLOW_SOURCE_COMMIT"
      - name: Select released Xcode 27 SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "$sdk_version" == 27.* ]] || { echo "iOS 27 SDK is required"; exit 1; }
      - name: Install project dependencies
        run: bundle install
      - name: Suppress Match profile tables
        run: |
          table_path=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          test -f "$table_path"
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$table_path"
      - name: Build using the existing certificate
        run: bundle exec fastlane build_LoopFollow
      - name: Verify native SDK and family app identity
        run: |
          python3 Scripts/verify-native-plate-ipa.py LoopFollow.ipa
      - name: Require successful checks for this exact source before upload
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const required = ['.github/workflows/native_plate_scanner.yml',
              '.github/workflows/plate_scanner_tests.yml', '.github/workflows/lint.yml'];
            for (let attempt = 0; attempt < 80; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                owner: 'shamiln876', repo: 'LoopFollow',
                head_sha: process.env.LOOPFOLLOW_SOURCE_COMMIT, event: 'pull_request', per_page: 50
              });
              // PR-description edits skip lint by design; require an actual executed check for this source.
              const checks = required.map(path => data.workflow_runs.find(run => run.path === path && run.conclusion !== 'skipped'));
              const native = checks[0];
              let reviewedNative = false;
              // One reviewed run completed all five UI tests, then Xcode hung while
              // finalizing. This exception is bound to its exact source/run/job;
              // it does not allow other cancelled runs or any failed test.
              if (process.env.LOOPFOLLOW_SOURCE_COMMIT === '4b3239876f7ff160afd594026d12f3e1b2d5a251' &&
                  native?.id === 39376256331 && native.head_sha === process.env.LOOPFOLLOW_SOURCE_COMMIT &&
                  native.status === 'completed' && native.conclusion === 'cancelled') {
                const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                  owner: 'shamiln876', repo: 'LoopFollow', run_id: native.id
                });
                if (!jobs.jobs.some(job => job.id === 118474962045 && job.conclusion === 'cancelled'))
                  throw new Error('Reviewed native job identity changed');
                const response = await fetch('https://api.github.com/repos/shamiln876/LoopFollow/actions/jobs/118474962045/logs', {
                  headers: {Authorization: 'Bearer ' + process.env.GH_PAT, Accept: 'application/vnd.github+json'}
                });
                if (!response.ok) throw new Error('Cannot read reviewed native log: HTTP ' + response.status);
                const log = await response.text();
                const expected = [
                  'CarnivalManualUITests testManualHalfBagelStillFillsAdvisorAfterCancellingScanner',
                  'SmartMealHandoffUITests testDirectPhotoCancellationKeepsAdvisorCarbs',
                  'SmartMealHandoffUITests testLowForecastRequiresAcceptAndPreservesEditedDose',
                  'SmartMealHandoffUITests testManualMealRemainsAvailableDuringVeryLowForecast',
                  'SmartMealHandoffUITests testOptionalScannerRequiresReviewAndUnknownResolution'
                ];
                const allPassed = expected.every(test => log.includes("Test Case '-[SmartMealUITests." + test + "]' passed ("));
                if (!allPassed || !log.includes('Executed 5 tests, with 0 failures (0 unexpected)') ||
                    !log.includes("Test Suite 'Selected tests' passed") || /Test Case '.*' failed/.test(log))
                  throw new Error('Reviewed log does not prove all five tests passed without failures');
                const fs = require('fs');
                const path = require('path');
                const receipt = {source: native.head_sha, runID: native.id, jobID: 118474962045,
                  expectedTests: expected, passed: 5, failed: 0, runnerConclusion: native.conclusion,
                  limitation: 'Xcode was cancelled during post-test finalization; real-photo accuracy remains untested',
                  logSHA256: require('crypto').createHash('sha256').update(log).digest('hex')};
                fs.writeFileSync(path.join(process.env.LOOPFOLLOW_WORKSPACE, 'native-ui-reviewed.log'), log);
                fs.writeFileSync(path.join(process.env.LOOPFOLLOW_WORKSPACE, 'native-ui-review.json'), JSON.stringify(receipt, null, 2));
                core.warning('Verified all five UI tests passed for the exact reviewed source; Xcode finalization was cancelled');
                reviewedNative = true;
              }
              const passed = (run, index) => run && run.status === 'completed' &&
                (run.conclusion === 'success' || (index === 0 && reviewedNative));
              const failed = checks.find((run, index) => run && run.status === 'completed' && !passed(run, index));
              if (failed) throw new Error('Required check did not pass: ' + failed.html_url);
              if (checks.every(passed)) {
                core.info('All required test evidence verified for ' + process.env.LOOPFOLLOW_SOURCE_COMMIT);
                return;
              }
              core.info('Waiting for native scanner, scanner tests and lint checks');
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Required checks are incomplete; TestFlight upload blocked');
      - name: Upload to existing LoopFollow TestFlight app
        run: bundle exec fastlane release
      - name: Read existing LoopFollow TestFlight availability
        run: bundle exec ruby ../scripts/testflight-read-status.rb com.D3GG62L9X8.LoopFollow testflight-status.json
      - name: Save build and distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-plate-testflight
          path: |
            loopfollow/LoopFollow.ipa
            loopfollow/LoopFollow.app.dSYM.zip
            loopfollow/buildlog/
            loopfollow/native-plate-ipa-verification.json
            loopfollow/testflight-status.json
            loopfollow/native-ui-review.json
            loopfollow/native-ui-reviewed.log
