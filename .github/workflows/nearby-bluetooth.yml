name: Nearby Bluetooth build and protocol checks
on:
  push:
    branches: [feature/nearby-bluetooth-readonly]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Authenticated wire protocol regression checks
        run: |
          swiftc Trio/Sources/Services/NearbySharing/NearbyPacket.swift Tests/Nearby/main.swift -o /tmp/nearby-tests
          /tmp/nearby-tests
      - name: Compile simulator app (no signing or upload)
        run: |
          set -o pipefail
          xcodebuild -workspace Trio.xcworkspace -scheme Trio -configuration Debug -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee /tmp/nearby-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nearby-build-log
          path: /tmp/nearby-build.log
